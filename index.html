<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kasir Penjualan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Sistem Kasir Penjualan</h2>

        <form action="backend.php" method="POST">
            <div class="form-grid">

                <div class="form-group">
                    <label for="harga">Harga Satuan (Rp)</label>
                    <input type="number" id="harga" name="harga" required placeholder="Contoh: 50000" min="0">
                </div>

                <div class="form-group">
                    <label for="qty">Jumlah (Qty)</label>
                    <input type="number" id="qty" name="qty" required placeholder="Contoh: 2" min="1">
                </div>

                <div class="form-group">
                    <label for="diskon">Diskon (%)</label>
                    <input type="number" id="diskon" name="diskon" step="0.1" placeholder="0" min="0" max="100">
                </div>

                <div class="form-group">
                    <label for="ppn">PPN (%)</label>
                    <input type="number" id="ppn" name="ppn" step="0.1" placeholder="11" min="0">
                </div>

                <div class="form-group full-width">
                    <label for="jumlah_orang">Jumlah Orang (Split Bill)</label>
                    <input type="number" id="jumlah_orang" name="jumlah_orang" value="1" min="1">
                </div>

            </div>

            <button type="submit" class="btn-submit">
                Hitung Total Transaksi
            </button>
        </form>
    </div>
</body>
</html>
